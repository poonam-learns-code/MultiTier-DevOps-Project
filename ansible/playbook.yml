---
- name: Setup Jenkins and Docker
  hosts: localhost
  connection: local
  become: yes
  tasks:
    - name: Clean up broken Jenkins repos (Force Fix)
      shell: rm -f /etc/apt/sources.list.d/jenkins*.list /etc/apt/sources.list.d/archive_uri-https_pkg_jenkins*.list
      ignore_errors: yes

    - name: Install Java
      apt:
        name: openjdk-17-jre
        update_cache: yes
        state: present

    - name: Download Jenkins Key directly
      shell: wget -q -O /usr/share/keyrings/jenkins-keyring.asc https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key

    - name: Add Jenkins Repo directly
      shell: echo "deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/" > /etc/apt/sources.list.d/jenkins.list

    - name: Update apt cache manually
      shell: apt-get update

    - name: Install Jenkins and Docker
      apt:
        pkg:
          - jenkins
          - docker.io
        state: present

    - name: Start Jenkins Service
      systemd:
        name: jenkins
        state: started
        enabled: yes

    - name: Start Docker Service
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes