---
- name: Fix Jenkins Startup and Complete Setup
  hosts: localhost
  connection: local
  become: yes
  tasks:
    - name: Install required fontconfig for Jenkins
      apt:
        name: fontconfig
        state: present
        update_cache: yes

    - name: Restart and Enable Jenkins
      systemd:
        name: jenkins
        state: restarted
        daemon_reload: yes
        enabled: yes

    - name: Start Docker Service
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes